      <section aria-labelledby="media-title">

        <div class="gallery-grid">
          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Biji%20Kopi.jpg"
              alt="Berbagai pilihan biji kopi berkualitas dengan aroma khas dan cita rasa yang nikmat."
              width="800"
              height="600"
              loading="lazy"
            />

          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Menu%20Kopi.jpg"
              alt="Beragam pilihan menu kopi dengan cita rasa yang khas dan cocok dinikmati kapan saja."
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Beragam pilihan menu kopi dengan cita rasa yang khas dan cocok dinikmati kapan saja.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Proses%20Seduh.jpg"
              alt="Proses penyeduhan kopi dengan teknik yang tepat untuk menghasilkan aroma dan rasa yang sempurna."
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Proses penyeduhan kopi dengan teknik yang tepat untuk menghasilkan aroma dan rasa yang sempurna.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Tampilan%20Dalam.jpg"
              alt="Suasana interior kedai yang nyaman dengan desain modern dan tempat duduk yang cocok untuk bersantai."
              width="800"
              height="600"
              loading="lazy"
            />

          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Tampilan%20Depan.jpg"
              alt="Tampilan depan kedai dengan desain menarik yang memberikan kesan hangat dan nyaman."
              width="800"
              height="600"
              loading="lazy"
            />

              height="600"
              loading="lazy"
