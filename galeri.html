<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Galeri Kopi Inz: foto menu, suasana kedai, dan musik pengiring." />
    <title>Galeri Kopi Inz - Website UMKM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#konten">Lewati ke konten utama</a>

    <header class="site-header">
      <nav class="nav" aria-label="Navigasi utama">
        <a class="brand" href="index.html">Kopi Inz</a>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="tentang.html">Tentang Kami</a></li>
          <li><a href="produk.html">Produk</a></li>
          <li><a aria-current="page" href="galeri.html">Galeri</a></li>
        </ul>
      </nav>
    </header>

    <main id="konten" class="page">
      <section aria-labelledby="galeri-title">
        <p class="eyebrow">Dokumentasi</p>
        <h1 id="galeri-title">Galeri Kopi Inz</h1>
      </section>

      <section aria-labelledby="media-title">
        <h2 id="media-title">Media usaha</h2>
        <div class="gallery-list">
          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/latte caramel.jpg"
              alt="Segelas Latte Caramel dingin dengan whipped cream dan siraman saus karamel"
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Latte Caramel, menu terbaru di daftar kami.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Butterscotch.jpg"
              alt="Segelas kopi Butterscotch dengan lapisan susu dan taburan gula aren"
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Butterscotch, menu paling sering dipesan saat sore.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/ice americano.jpg"
              alt="Segelas Ice Americano dengan es batu dan lapisan krema di permukaan"
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Ice Americano disajikan tanpa gula, rasa kopinya terasa penuh.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Cappuccino.jpg"
              alt="Secangkir Cappuccino panas dengan latte art dan biji kopi di piring saji"
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Cappuccino panas untuk pagi yang masih dingin.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/coffe.jpg"
              alt="Espresso dituang ke cangkir berisi susu hingga membentuk latte art"
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Proses menuang susu yang membentuk latte art.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              class="product-photo"
              src="assets/images/Matcha Latte.jpg"
              alt="Segelas Matcha Latte dingin saat susu dituang ke atas bubuk matcha"
              width="800"
              height="600"
              loading="lazy"
            />
            <figcaption>Matcha Latte untuk yang sedang ingin libur dari kopi.</figcaption>
          </figure>
        </div>
      </section>

      <section aria-labelledby="audio-title">
        <h2 id="audio-title">Suasana kedai Kopi Inz</h2>
        <p id="audio-note">Dengarkan alunan santai sambil menikmati secangkir kopi.</p>
        <audio controls aria-describedby="audio-note" preload="none">
          <source src="assets/audio/hindia.mp4" type="audio/mp4" />
          Browser kamu belum mendukung pemutar audio.
          <a href="assets/audio/hindia.mp4">Unduh lagu pengiring</a>.
        </audio>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="tahun">2026</span> Kopi Inz. Data pada halaman ini bersifat dummy.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
